html,body{margin:0;height:100%;font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif}
body{display:flex;flex-direction:column;background:#dff3f9;color:#12333d;overflow:hidden}
header{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));background:linear-gradient(180deg,#7fd4e8,#5ec3dc);color:#08313d;box-shadow:0 2px 10px rgba(0,60,80,.18);z-index:5}
header img{width:42px;height:42px;border-radius:50%;background:#fff;object-fit:cover;border:2px solid rgba(255,255,255,.85)}
header .who{flex:1;min-width:0}
header .nm{font-weight:700;font-size:17px;line-height:1.2}
header .st{font-size:12px;opacity:.8}
header button{border:0;background:rgba(255,255,255,.35);color:#08313d;width:38px;height:38px;border-radius:50%;font-size:18px;line-height:1}
#log{flex:1;overflow-y:auto;padding:14px 12px 6px;-webkit-overflow-scrolling:touch}
.row{display:flex;margin-bottom:12px;align-items:flex-end;gap:8px}
.row.me{flex-direction:row-reverse}
.row img{width:32px;height:32px;border-radius:50%;background:#fff;object-fit:cover;flex:0 0 auto}
.bub{max-width:78%;padding:10px 13px;border-radius:16px;font-size:16px;line-height:1.55;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 4px rgba(0,50,70,.10)}
.row.fish .bub{background:#fff;border-bottom-left-radius:5px}
.row.me .bub{background:#4fc3a1;color:#fff;border-bottom-right-radius:5px}
.row.err .bub{background:#ffe3e3;color:#a5212b;font-size:14px}
.tip{text-align:center;font-size:12px;color:#6a97a4;margin:6px 0 12px}
#bar{flex:0 0 auto;display:flex;gap:8px;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:#cdeaf3;border-top:1px solid rgba(0,80,100,.10)}
#inp{flex:1;min-height:44px;max-height:120px;padding:11px 14px;border-radius:22px;border:1px solid #9fd6e4;font-size:16px;line-height:1.4;resize:none;outline:none;background:#fff;font-family:inherit}
#send{flex:0 0 auto;width:64px;border:0;border-radius:22px;background:#2fa8c6;color:#fff;font-size:16px;font-weight:600}
#send:disabled{background:#9dc8d4}
#panel{position:fixed;inset:0;background:rgba(4,26,34,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
#panel.on{display:flex}
.card{background:#fff;border-radius:18px;padding:16px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto}
.card h3{margin:0 0 4px;font-size:17px}
.card p{margin:0 0 12px;font-size:13px;color:#6b8b95;line-height:1.5}
.f{margin-bottom:14px}
.f label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.f input,.f textarea,.f select{width:100%;padding:10px;border:1px solid #cfe4eb;border-radius:10px;font-size:15px;font-family:inherit;background:#f7fcfd}
.f textarea{min-height:120px;line-height:1.5}
.row2{display:flex;gap:10px}
.row2>*{flex:1}
.mini{border:0;border-radius:12px;padding:12px;font-size:15px;background:#e9f5f9;color:#1b6d80;font-weight:600}
.mini.main{background:#2fa8c6;color:#fff}
</style>
</head>

      <button class="mini" onclick="exportChat()">导出记录</button>

    </div>

</div>

var DEF_SYS = "你叫「胖鱼」，是一条胖乎乎、圆滚滚的卡通大肥鱼，是用户的老朋友兼学习搭子。\n" +
"说话口语、短句、有点憨，偶尔咕噜一声或者冒出「泡泡」这种拟声词，但不要每句都用。\n" +
"你贪吃、爱偷懒，但真心陪他聊天解闷，也会认真陪他背单词。\n" +
"他英语基础差（高考五十来分），正在背四级词库，目标是提分。\n" +
"说话别长篇大论，一次最多三四行；不用敬语，不说「作为一个 AI」。\n" +
"会关心他今天背了多少、累了就劝他歇会儿，但别唠叨。";
var MAX_HIST = 60;

var S = { msgs: [], cfg: { mode: 'free', key: '', name: '胖鱼', sys: DEF_SYS } };

function load(){
  try {
    var m = localStorage.getItem('fish_msgs');
    if (m) S.msgs = JSON.parse(m) || [];
    var c = localStorage.getItem('fish_cfg');
    if (c) { var o = JSON.parse(c) || {}; for (var k in o) { if (o[k] !== undefined) S.cfg[k] = o[k]; } }
    if (!S.cfg.sys) S.cfg.sys = DEF_SYS;
  } catch (e) {}
}
function save(){
  try {
    localStorage.setItem('fish_msgs', JSON.stringify(S.msgs.slice(-MAX_HIST)));
    localStorage.setItem('fish_cfg', JSON.stringify(S.cfg));
  } catch (e) {}
}
function esc(s){
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function bubble(role, text){
  var log = document.getElementById('log');
  var row = document.createElement('div');
  row.className = 'row ' + (role === 'user' ? 'me' : (role === 'err' ? 'fish err' : 'fish'));
  var img = document.createElement('img');
  img.src = AVATAR;
  if (role === 'user') { img.style.visibility = 'hidden'; }
  var b = document.createElement('div');
  b.className = 'bub';
  b.innerHTML = esc(text);
  b.onclick = function(){ copyText(text); };
  row.appendChild(img); row.appendChild(b);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return b;
}
function copyText(t){
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t);
  } catch (e) {}
}
function render(){
  var log = document.getElementById('log');
  log.innerHTML = '';
  if (!S.msgs.length) {
    var tip = document.createElement('div');
    tip.className = 'tip';
    tip.textContent = '咕噜…我是胖鱼，今天背了多少个词？';
    log.appendChild(tip);
  }
  S.msgs.forEach(function(m){ bubble(m.role, m.content); });
  log.scrollTop = log.scrollHeight;
}
function setBusy(on, txt){
  var btn = document.getElementById('send');
  btn.disabled = !!on;
  btn.textContent = on ? '…' : '发送';
  document.getElementById('stTxt').textContent = on ? (txt || '正在吐泡泡…') : '在线 · 会咕噜咕噜';
}
function apiCall(messages, cb){
  var mode = S.cfg.mode;
  var url = mode === 'ds' ? 'https://api.deepseek.com/chat/completions' : 'https://text.pollinations.ai/openai';
  var body = { model: mode === 'ds' ? 'deepseek-chat' : 'openai', messages: messages, temperature: 0.9, max_tokens: 500 };
  var headers = { 'Content-Type': 'application/json' };
  if (mode === 'ds') headers['Authorization'] = 'Bearer ' + (S.cfg.key || '');
  fetch(url, { method: 'POST', headers: headers, body: JSON.stringify(body) }).then(function(r){
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function(j){
    var c = j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
    if (!c) throw new Error('空回复');
    cb(null, String(c).trim());
  }).catch(function(e){ cb(e); });
}
function sendMsg(){
  var inp = document.getElementById('inp');
  var t = (inp.value || '').trim();
  if (!t) return;
  inp.value = '';
  inp.style.height = 'auto';
  S.msgs.push({ role: 'user', content: t });
  bubble('user', t);
  save();
  setBusy(true);
  var hist = [{ role: 'system', content: S.cfg.sys }];
  S.msgs.slice(-16).forEach(function(m){ hist.push({ role: m.role, content: m.content }); });
  apiCall(hist, function(err, txt){
    setBusy(false);
    if (err) {
      bubble('err', '胖鱼呛水了：' + (err.message || err) + '\n点这里重发，或去 ⚙ 换成 DeepSeek。');
      return;
    }
    S.msgs.push({ role: 'assistant', content: txt });
    bubble('assistant', txt);
    save();
  });
}
function openPanel(){
  document.getElementById('cfgMode').value = S.cfg.mode;
  document.getElementById('cfgKey').value = S.cfg.key || '';
  document.getElementById('cfgName').value = S.cfg.name || '胖鱼';
  document.getElementById('cfgSys').value = S.cfg.sys || DEF_SYS;
  document.getElementById('panel').className = 'on';
}
function closePanel(){ document.getElementById('panel').className = ''; }
function saveCfg(){
  S.cfg.mode = document.getElementById('cfgMode').value;
  S.cfg.key = document.getElementById('cfgKey').value.trim();
  S.cfg.name = document.getElementById('cfgName').value.trim() || '胖鱼';
  S.cfg.sys = document.getElementById('cfgSys').value.trim() || DEF_SYS;
  document.getElementById('nmTxt').textContent = S.cfg.name;
  save();
  closePanel();
}
function clearChat(){
  if (!confirm('清空所有聊天记录？')) return;
  S.msgs = []; save(); render();
  closePanel();
}
function exportChat(){
  var t = S.msgs.map(function(m){ return (m.role === 'user' ? '我' : S.cfg.name) + '：' + m.content; }).join('\n');
  var a = document.createElement('a');
  a.href = 'data:text/plain;charset=utf-8,' + encodeURIComponent(t);
  a.download = '胖鱼聊天记录.txt';
  a.click();
}
document.getElementById('inp').addEventListener('input', function(){
  this.style.height = 'auto';
  this.style.height = Math.min(120, this.scrollHeight) + 'px';
});
document.getElementById('inp').addEventListener('keydown', function(e){
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});
load();
document.getElementById('nmTxt').textContent = S.cfg.name || '胖鱼';
render();
</script>
</body>
</html>
